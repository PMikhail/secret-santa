<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secret Santa Picker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      padding: 40px 10px;
      display: flex;
      justify-content: center;
      color: #0f172a;
    }
    .box {
      background: #f9fafb;
      padding: 24px 20px 28px;
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(15,23,42,0.35);
      width: 380px;
      max-width: 100%;
      text-align: center;
      border: 1px solid #e5e7eb;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 4px;
      font-size: 22px;
      color: #111827;
    }
    .subtitle {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 12px;
    }
    label {
      display: block;
      text-align: left;
      font-size: 13px;
      color: #374151;
      margin-top: 8px;
      margin-bottom: 4px;
    }
    select, input {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      box-sizing: border-box;
      background: #ffffff;
      outline: none;
      transition: box-shadow 0.15s, border-color 0.15s;
    }
    select:focus, input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59,130,246,0.35);
    }

    #result {
      margin-top: 18px;
      font-size: 20px;
      font-weight: 700;
      color: #16a34a;
      min-height: 28px;
    }
    small {
      display: block;
      margin-top: 12px;
      font-size: 12px;
      color: #6b7280;
    }

    /* Wheel layout */
    #wheel-wrapper {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 22px auto 0;
    }

    /* Arrow at the top */
    #pointer {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-bottom: 22px solid #ef4444;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.35));
      z-index: 3;
    }

    #wheelCanvas {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      border: 6px solid #111827;
      box-shadow:
        0 0 0 6px #e5e7eb,
        0 16px 30px rgba(15,23,42,0.45);
      display: block;
      margin: 0 auto;
      background: transparent;
    }

    /* Center button */
    #revealBtn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 4;
      width: 130px;
      height: 50px;
      border-radius: 999px;
      border: none;
      background: radial-gradient(circle at 30% 30%, #bfdbfe, #1d4ed8);
      color: #f9fafb;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(15,23,42,0.45);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    #revealBtn:hover {
      background: radial-gradient(circle at 30% 30%, #dbeafe, #1d4ed8);
    }
    #revealBtn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Secret Santa Picker</h2>
    <div class="subtitle">Select your name, enter your code, then spin the wheel 🎄</div>

    <label for="picker">Your Name</label>
    <select id="picker">
      <option value="" disabled selected>Select your name</option>
      <option>Andrew</option>
      <option>Jacob</option>
      <option>Tony</option>
      <option>Pola</option>
      <option>Maryam</option>
      <option>Madonna</option>
      <option>Phillip</option>
      <option>Matthew</option>
      <option>Ashley</option>
      <option>Christian</option>
    </select>

    <label for="code">Your 3-character code</label>
    <input id="code" type="text" maxlength="3" placeholder="e.g. A2B" />

    <div id="wheel-wrapper">
      <div id="pointer"></div>
      <canvas id="wheelCanvas" width="280" height="280"></canvas>
      <button id="revealBtn" onclick="reveal()">Spin & Reveal</button>
    </div>

    <div id="result"></div>
    <small>Pick your own name, enter your code, click once, then don’t show this screen to anyone else 😉</small>
  </div>

  <script>
    // Light deterrent against casual snooping
    document.addEventListener("contextmenu", e => e.preventDefault());
    document.addEventListener("keydown", e => {
      if (
        e.key === "F12" ||
        (e.ctrlKey && ["u","U","s","S"].includes(e.key))
      ) e.preventDefault();
    });

    const _n = [
      "\x41\x6e\x64\x72\x65\x77",
      "\x4a\x61\x63\x6f\x62",
      "\x54\x6f\x6e\x79",
      "\x50\x6f\x6c\x61",
      "\x4d\x61\x72\x79\x61\x6d",
      "\x4d\x61\x64\x6f\x6e\x6e\x61",
      "\x50\x68\x69\x6c\x6c\x69\x70",
      "\x4d\x61\x74\x74\x68\x65\x77",
      "\x41\x73\x68\x6c\x65\x79",
      "\x43\x68\x72\x69\x73\x74\x69\x61\x6e"
    ];

    const _a = [
      "\x50\x68\x69\x6c\x6c\x69\x70",
      "\x43\x68\x72\x69\x73\x74\x69\x61\x6e",
      "\x41\x73\x68\x6c\x65\x79",
      "\x41\x6e\x64\x72\x65\x77",
      "\x4d\x61\x64\x6f\x6e\x6e\x61",
      "\x4d\x61\x74\x74\x68\x65\x77",
      "\x4a\x61\x63\x6f\x62",
      "\x54\x6f\x6e\x79",
      "\x4d\x61\x72\x79\x61\x6d",
      "\x4d\x61\x74\x74\x68\x65\x77"
    ];

    const _c_names = [
      "Andrew","Jacob","Tony","Pola","Maryam",
      "Madonna","Phillip","Matthew","Ashley","Christian"
    ];
    const _c_vals  = [
      "QTdR",
      "SjVNLg==",
      "VDlY",
      "UDNMLg==",
      "TTJE",
      "RDhOLg==",
      "UDRI",
      "TTZU",
      "QTFI",
      "QzdOLg=="
    ];

    function _decode(b) {
      return atob(b).replace(/\./g,""); // strip extra dots
    }

    function _getCode(name) {
      let i = _c_names.indexOf(name);
      if (i === -1) return null;
      return _decode(_c_vals[i]).toUpperCase();
    }

    function _getAssigned(name) {
      let i = _n.indexOf(name);
      return _a[i] || null;
    }

    // Canvas-based wheel drawing
    const displayNames = _c_names.slice();
    let canvas, ctx;
    let currentAngle = 0; // radians

    function drawWheel(angle) {
      if (!ctx) return;
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const radius = Math.min(w, h) / 2 - 6;
      const innerRadius = radius * 0.55;
      const count = displayNames.length;
      const step = (2 * Math.PI) / count;

      ctx.clearRect(0, 0, w, h);
      ctx.save();
      ctx.translate(cx, cy);

      const colors = [
        "#f97316", "#22c55e", "#3b82f6", "#ec4899",
        "#eab308", "#6366f1", "#10b981", "#f59e0b",
        "#0ea5e9", "#a855f7"
      ];

      // Draw slices
      for (let i = 0; i < count; i++) {
        const start = angle + i * step;
        const end = start + step;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, start, end);
        ctx.closePath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        ctx.strokeStyle = "rgba(15,23,42,0.4)";
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }

      // Inner circle
      ctx.beginPath();
      ctx.arc(0, 0, innerRadius, 0, 2 * Math.PI);
      ctx.fillStyle = "#f9fafb";
      ctx.fill();

      // Text (names) - upright, moving with slices
      ctx.font = "bold 12px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#ffffff";

      for (let i = 0; i < count; i++) {
        const centerAngle = angle + i * step + step / 2;
        const textRadius = (radius + innerRadius) / 2;

        ctx.save();
        ctx.rotate(centerAngle);
        ctx.translate(0, -textRadius);
        ctx.rotate(-centerAngle); // keep text upright
        ctx.fillText(displayNames[i], 0, 0);
        ctx.restore();
      }

      ctx.restore();
    }

    document.addEventListener("DOMContentLoaded", () => {
      canvas = document.getElementById("wheelCanvas");
      ctx = canvas.getContext("2d");
      drawWheel(currentAngle);
    });

    function reveal() {
      const picker = document.getElementById("picker").value;
      const codeInput = document.getElementById("code").value.trim().toUpperCase();
      const resultBox = document.getElementById("result");
      const btn = document.getElementById("revealBtn");

      if (!picker) {
        resultBox.textContent = "Please select your name first.";
        resultBox.style.color = "red";
        return;
      }

      if (!codeInput) {
        resultBox.textContent = "Please enter your code.";
        resultBox.style.color = "red";
        return;
      }

      const expectedCode = _getCode(picker);
      if (!expectedCode || codeInput !== expectedCode) {
        resultBox.textContent = "Code is incorrect for this name.";
        resultBox.style.color = "red";
        return;
      }

      const target = _getAssigned(picker);
      if (!target) {
        resultBox.textContent = "Something went wrong. Tell Phillip :)";
        resultBox.style.color = "red";
        return;
      }

      const targetName = target; // e.g., "Phillip"
      const idx = displayNames.indexOf(targetName);
      if (idx === -1) {
        resultBox.textContent = "Something went wrong. Tell Phillip :)";
        resultBox.style.color = "red";
        return;
      }

      resultBox.textContent = "";
      resultBox.style.color = "#16a34a";

      const count = displayNames.length;
      const step = (2 * Math.PI) / count;

      // Center angle of the target slice (relative to wheel)
      const segmentCenter = idx * step + step / 2;

      // Pointer is visually at the top (upwards), which is -90 degrees = -π/2
      const pointerAngle = -Math.PI / 2;
      const extraTurns = 3 + Math.floor(Math.random() * 2); // 3–4 full spins
      const finalAngle = pointerAngle - segmentCenter + extraTurns * 2 * Math.PI;

      const duration = 2600;
      const startAngle = currentAngle;
      const delta = finalAngle - startAngle;
      const startTime = performance.now();
      btn.disabled = true;

      function animate(now) {
        const t = Math.min((now - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic
        currentAngle = startAngle + delta * eased;
        drawWheel(currentAngle);

        if (t < 1) {
          requestAnimationFrame(animate);
        } else {
          btn.disabled = false;
          resultBox.textContent = "You got: " + target + "!";
        }
      }

      requestAnimationFrame(animate);
    }
  </script>
</body>

</html>
